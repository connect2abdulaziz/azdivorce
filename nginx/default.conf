server {
    listen 80;
    server_name legaldivorcedocs.com www.legaldivorcedocs.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name legaldivorcedocs.com www.legaldivorcedocs.com;

    ssl_certificate /etc/letsencrypt/live/legaldivorcedocs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legaldivorcedocs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    client_max_body_size 64M;

    # Block xmlrpc attacks
    location = /xmlrpc.php {
        deny all;
        return 403;
    }

    # Block PHP in uploads
    location ~* /wp-content/uploads/.*\.(php|php5|phtml)$ {
        deny all;
        return 403;
    }

    # Block hidden files
    location ~ /\.ht {
        deny all;
    }

    location / {
        proxy_pass http://wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300;
    }
}
